<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Gravador de Áudio</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="./manifest.json">
</head>

<body>

    <div class="container-gravador">

        <button id="btn-gravador">
            <img src="img/icon-192.png" alt="Gravando" class="icone-gravador"> Clique e Segure para Gravar
        </button>

        <p id="status-gravacao">
            Status: Pronto para gravar
        </p>

    </div>

    <script src="js/script.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./pwabuilder-sw.js');
            });
        }
    </script>

</body>
</html>
